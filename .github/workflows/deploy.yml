name: Deploy

on:
  push:
    branches: [ "main" ] 

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: doccker
        run: |
          echo "Iniciando o deploy..."
          docker compose down
          docker compose up -d --build
          echo "Deploy realizado com sucesso!"
