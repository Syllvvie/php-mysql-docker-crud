name: Test

on:
  push:
    branches: [ main ]
  workflow_call:

jobs:
  test-containers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test PHP
        run: |
          echo "Iniciando validação do ambiente..."
          docker compose up -d
          sleep 5
          docker compose ps
          echo "Ambiente validado com sucesso!"
